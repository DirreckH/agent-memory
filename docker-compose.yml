# 评测部署：崩溃自动拉起，data/ 卷持久化数据库与输入日志。
# 用法：docker compose up -d --build
services:
  agent-memory:
    build:
      context: .
      args:
        # 国内轻量服务器构建提速；海外部署删掉此行即可回落官方源。
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: agent-memory
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
